name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Must match deploy/unraid/play-pokemon-attendance.xml (checked by test/unit/unraid-template.test.ts).
  IMAGE_NAME: ghcr.io/towerism/play-pokemon-attendance

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests, then the built app driven over HTTP (the server project builds .output/).
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  image:
    name: Image (smoke test, publish)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          load: true
          tags: play-pokemon-attendance:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test (entrypoint, PUID/PGID, secrets, setup, graceful stop)
        run: test/docker/smoke.sh play-pokemon-attendance:test

      - name: Litestream smoke test (replicate, graceful stop, restore, fail loudly)
        run: test/docker/litestream.sh play-pokemon-attendance:test

      - name: Restore drill (backup, restore, restore without secrets, truncated archive)
        run: test/docker/restore-drill.sh play-pokemon-attendance:test

      # Pushes publish, and so do PRs from this repo, so a PR can be tried on
      # Unraid as :pr-<number>. Fork PRs get a read-only token: smoke test only.
      - name: Decide whether to publish
        id: publish
        run: echo "enabled=${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # latest / X.Y.Z / X.Y from release tags (ADR-0006); edge + sha from main;
          # pr-<number> from PRs (moves with each push to the PR).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=ref,event=pr
            type=sha,enable=${{ github.event_name == 'push' }}

      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push'
      - uses: docker/login-action@v3
        if: steps.publish.outputs.enabled == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          # PR images are amd64 only (Unraid), skipping the slow QEMU arm64 build.
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
