name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests, then the built app driven over HTTP (the server project builds .output/).
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  # Browser journeys (Playwright) against the production build. Runs alongside
  # check and image; the image job doesn't wait for it (it never gates publishing).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Builds .output/ first; one retry in CI, and a retried pass shows as flaky.
      - run: pnpm test:e2e
      - name: Upload report, traces, screenshots and server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The kit's reusable image workflow (ADR-0014, kit ADR-0004): builds target `app` once (amd64 only,
  # ADR-0006), runs the three container tests below against that image, and only then publishes that
  # same image: edge + sha-<short> from main, pr-<number> from PRs of this repo (fork PRs smoke-test
  # only). X.Y.Z / X.Y / latest come from the release job, on the digest this job outputs.
  # Pinned by full commit SHA; keep the comment equal to package.json's @towerism/selfhost-kit version.
  image:
    name: Image (smoke test, publish)
    needs: check
    permissions:
      contents: read
      packages: write
    uses: Towerism/selfhost-kit/.github/workflows/app-image.yml@4692fe46c64d522f611301cb4341fc2efa3bad48 # v1.0.0
    with:
      # Must match deploy/unraid/play-pokemon-attendance.xml (checked by test/unit/unraid-template.test.ts).
      image-name: ghcr.io/towerism/play-pokemon-attendance
      target: app
      # Container smoke test (entrypoint, PUID/PGID, secrets, setup, graceful stop); Litestream
      # (replicate, graceful stop, restore, fail loudly); restore drill (backup, restore, restore
      # without secrets, truncated archive). Each gets the built image's tag as its only argument.
      smoke-scripts: |
        test/docker/smoke.sh
        test/docker/litestream.sh
        test/docker/restore-drill.sh

  # The kit's reusable release workflow (ADR-0014, kit ADR-0004), with the shared semantic-release
  # config (.releaserc.json extends @towerism/selfhost-kit/release-config). A tag pushed with
  # GITHUB_TOKEN starts no new run, so the release happens here, after check, e2e and image are green,
  # on the image this run smoke-tested: dry run for the version, tag the image job's digest
  # X.Y.Z / X.Y / latest, then the git tag and GitHub Release. Nothing is committed back to main.
  # Pinned by the same commit SHA as the image job.
  release:
    name: Release
    needs: [check, e2e, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    uses: Towerism/selfhost-kit/.github/workflows/app-release.yml@4692fe46c64d522f611301cb4341fc2efa3bad48 # v1.0.0
    with:
      # Must match deploy/unraid/play-pokemon-attendance.xml (checked by test/unit/unraid-template.test.ts).
      image-name: ghcr.io/towerism/play-pokemon-attendance
      digest: ${{ needs.image.outputs.digest }}
