name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Must match deploy/unraid/play-pokemon-attendance.xml (checked by test/unit/unraid-template.test.ts).
  IMAGE_NAME: ghcr.io/towerism/play-pokemon-attendance

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests, then the built app driven over HTTP (the server project builds .output/).
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  # Browser journeys (Playwright) against the production build. Runs alongside
  # check and image; the image job doesn't wait for it (it never gates publishing).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Builds .output/ first; one retry in CI, and a retried pass shows as flaky.
      - run: pnpm test:e2e
      - name: Upload report, traces, screenshots and server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The kit's reusable image workflow (ADR-0014, kit ADR-0004): builds target `app` once (amd64 only,
  # ADR-0006), runs the three container tests below against that image, and only then publishes that
  # same image: edge + sha-<short> from main, pr-<number> from PRs of this repo (fork PRs smoke-test
  # only). X.Y.Z / X.Y / latest come from the release job, on the digest this job outputs.
  # Pinned by full commit SHA; keep the comment equal to package.json's @towerism/selfhost-kit version.
  image:
    name: Image (smoke test, publish)
    needs: check
    permissions:
      contents: read
      packages: write
    uses: Towerism/selfhost-kit/.github/workflows/app-image.yml@4c453910482af10fad937ff27f3d72c8f31a3bf1 # v0.4.2
    with:
      # Must match deploy/unraid/play-pokemon-attendance.xml (checked by test/unit/unraid-template.test.ts).
      image-name: ghcr.io/towerism/play-pokemon-attendance
      target: app
      # Container smoke test (entrypoint, PUID/PGID, secrets, setup, graceful stop); Litestream
      # (replicate, graceful stop, restore, fail loudly); restore drill (backup, restore, restore
      # without secrets, truncated archive). Each gets the built image's tag as its only argument.
      smoke-scripts: |
        test/docker/smoke.sh
        test/docker/litestream.sh
        test/docker/restore-drill.sh

  # semantic-release from Conventional Commits (.releaserc.json). A tag pushed with
  # GITHUB_TOKEN starts no new run, so the release happens here, on the image this run
  # smoke-tested: dry run for the version, tag that image X.Y.Z / X.Y / latest, then the
  # git tag and GitHub Release. Nothing is committed back to main.
  release:
    name: Release
    needs: [check, e2e, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Writes $RUNNER_TEMP/release-version only when a release is due. Skips (no file)
      # when nothing releasable landed, or when main has moved on: the newer run releases.
      - name: Next version (dry run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run

      - name: Decide whether to release
        id: next
        run: |
          if [ -s "$RUNNER_TEMP/release-version" ]; then
            echo "version=$(cat "$RUNNER_TEMP/release-version")" >> "$GITHUB_OUTPUT"
          else
            echo "No release due."
          fi

      - uses: docker/login-action@v3
        if: steps.next.outputs.version != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before the git tag, so a GitHub Release never exists without its image.
      - name: Tag the image X.Y.Z, X.Y, latest
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::error::The image job published no digest; refusing to release $VERSION."
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$VERSION" \
            --tag "$IMAGE_NAME:${VERSION%.*}" \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_NAME@$DIGEST"
          docker buildx imagetools inspect "$IMAGE_NAME:$VERSION"

      - name: Git tag and GitHub Release
        if: steps.next.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
